# Base ruleset shipped with Flutter, plus a few rules that catch real defects.
#
# The previous file declared its settings under a top-level `analysis_options:`
# key, which the analyzer does not recognise - so its `exclude` list silently
# did nothing and generated code was being linted. It also never included
# flutter_lints, so the Flutter-specific rules were missing entirely.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # Losing a BuildContext across an await is a real crash, not a suggestion.
    use_build_context_synchronously: warning
    # Unawaited futures in this app usually mean a database write that nobody
    # is watching for failure.
    unawaited_futures: warning
    # Missing translations should be visible, not silently fall back.
    missing_required_param: error
    missing_return: error

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    # Relative imports inside lib/ (enforced for consistency; the opposite
    # rule, always_use_package_imports, must not be enabled alongside it).
    - prefer_relative_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - hash_and_equals
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - use_full_hex_values_for_flutter_colors
    - void_checks

    # --- Flutter widget hygiene -------------------------------------------
    - sized_box_for_whitespace
    - sort_child_properties_last
    - use_colored_box
    - use_decorated_box
    - use_key_in_widget_constructors

    # --- Readability -------------------------------------------------------
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_interpolation_to_compose_strings
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_string_buffers

    # Deliberately NOT enabled (they were in the old config and produced pure
    # noise rather than finding defects):
    #   prefer_expression_function_bodies, prefer_int_literals,
    #   unnecessary_lambdas, use_setters_to_change_properties,
    #   sort_pub_dependencies, sort_constructors_first
